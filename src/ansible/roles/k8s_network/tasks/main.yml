---
# ============================================================================
# Verification gate (REQ-018) — non-blocking cgroup driver consistency check
# ============================================================================
# NOTE: kubeadm GENERATES /var/lib/kubelet/config.yaml with `cgroupDriver:
# systemd`, which does NOT reflect the effective kubelet driver. The effective
# driver is set via the systemd drop-in (--cgroup-driver=cgroupfs), which
# overrides config.yaml. Parsing config.yaml therefore always yields "systemd"
# and caused this gate to falsely hard-fail a healthy cluster -- blocking
# Cilium install and leaving nodes NotReady. We now verify the two files the
# roles actually control (containerd config + kubelet drop-in) and WARN on any
# mismatch instead of aborting.
- name: Check containerd and kubelet cgroup driver consistency (cgroupfs)
  shell: |
    set -o pipefail
    # --- containerd: authoritative value is the deployed config template ---
    CONTAINERD_CONFIG=/etc/containerd/config.toml
    if [ -f "$CONTAINERD_CONFIG" ]; then
      CONTAINERD_DRIVER=$(grep -i SystemdCgroup "$CONTAINERD_CONFIG" 2>/dev/null | awk '{print $3}' | tr -d '",' | tail -1)
    fi
    [ -z "$CONTAINERD_DRIVER" ] && CONTAINERD_DRIVER="(not found)"

    # --- kubelet: authoritative value is the systemd drop-in (CLI flag overrides
    #     the kubeadm generated config.yaml), which is what sets the EFFECTIVE driver. ---
    KUBELET_DROPIN=/etc/systemd/system/kubelet.service.d/10-cgroup.conf
    KUBELET_DRIVER="(not found)"
    if [ -f "$KUBELET_DROPIN" ]; then
      KUBELET_DRIVER=$(grep -Eo -- '--cgroup-driver=[^"[:space:]]+' "$KUBELET_DROPIN" 2>/dev/null | head -1 | cut -d= -f2-)
    fi
    [ -z "$KUBELET_DRIVER" ] && KUBELET_DRIVER="(not found)"

    echo "containerd SystemdCgroup=$CONTAINERD_DRIVER kubelet cgroupDriver=$KUBELET_DRIVER"

    # Non-blocking: report the findings. If both are consistently cgroupfs the
    # cluster is healthy; otherwise surface a warning so the operator can fix.
    if [ "$CONTAINERD_DRIVER" = "false" ] && [ "$KUBELET_DRIVER" = "cgroupfs" ]; then
      echo "OK: containerd (SystemdCgroup=false) and kubelet (--cgroup-driver=cgroupfs) are consistent."
    else
      echo "WARN: cgroup driver mismatch detected. Expected containerd SystemdCgroup=false and kubelet --cgroup-driver=cgroupfs." >&2
    fi
  register: driver_check
  changed_when: false
  failed_when: false

# ============================================================================
# Helm installation (REQ-009) — official binary to /usr/local/bin
# ============================================================================
- name: Check if Helm is already installed
  command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm binary tarball
  get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-{{ helm_os }}-{{ helm_arch }}.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}-{{ helm_os }}-{{ helm_arch }}.tar.gz"
    checksum: "{{ helm_checksum }}"
  when: helm_check.rc != 0 or (helm_version not in helm_check.stdout)

- name: Extract Helm binary
  unarchive:
    src: "/tmp/helm-{{ helm_version }}-{{ helm_os }}-{{ helm_arch }}.tar.gz"
    dest: /tmp
    remote_src: yes
  when: helm_check.rc != 0 or (helm_version not in helm_check.stdout)

- name: Install Helm to /usr/local/bin
  copy:
    src: "/tmp/{{ helm_os }}-{{ helm_arch }}/helm"
    dest: /usr/local/bin/helm
    remote_src: yes
    mode: '0755'
  when: helm_check.rc != 0 or (helm_version not in helm_check.stdout)

# ============================================================================
# Cilium Helm repo (REQ-010)
# ============================================================================
- name: Add Cilium Helm repository
  command: helm repo add {{ cilium_repo_name }} {{ cilium_repo_url }}
  register: cilium_repo_add
  changed_when: "'already exists' not in (cilium_repo_add.stdout + cilium_repo_add.stderr)"
  failed_when: cilium_repo_add.rc != 0 and 'already exists' not in (cilium_repo_add.stdout + cilium_repo_add.stderr)

- name: Update Helm repositories
  command: helm repo update {{ cilium_repo_name }}
  changed_when: false

# ============================================================================
# Cilium install (REQ-011, REQ-012) — idempotent via helm list check
# ============================================================================
- name: Check if Cilium release already exists
  command: helm list -n {{ cilium_namespace }} -q
  register: cilium_release_list
  changed_when: false

- name: Install Cilium via Helm
  command: >
    helm install {{ cilium_release_name }} {{ cilium_repo_name }}/cilium
    --namespace {{ cilium_namespace }}
    --version {{ cilium_version }}
    --set image.pullPolicy={{ cilium_image_pull_policy }}
    --set ipam.mode={{ cilium_ipam_mode }}
    --set etcd.enabled={{ cilium_etcd_enabled | string | lower }}
  when: cilium_release_name not in cilium_release_list.stdout_lines

# ============================================================================
# Node readiness gate (REQ-008) — wait for ALL nodes to be Ready after Cilium
# ============================================================================
# Uses `kubectl wait` (introduced in kubectl 1.23) which is authoritative: it
# only returns success once EVERY matching node has the Ready condition true.
# A single NotReady/Unknown node keeps the command non-zero, so the retry loop
# does not exit early while other nodes are still settling.
- name: Wait for all nodes to become Ready
  command: >
    kubectl wait --for=condition=Ready node --all --timeout=5s
  register: node_status
  retries: 60
  delay: 5
  until: node_status.rc == 0
  changed_when: false
