---
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl settings for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: yes
  loop:
    - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { key: 'net.ipv4.ip_forward', value: '1' }
    - { key: 'net.ipv6.conf.default.forwarding', value: '1' }

- name: Install Containerd and dependencies
  apt:
    name:
      - containerd
    state: present
    update_cache: yes

- name: Create containerd configuration directory
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Deploy containerd configuration with SystemdCgroup disabled (cgroupfs)
  template:
    src: containerd.toml.j2
    dest: /etc/containerd/config.toml
  notify: Restart containerd

- name: Create Kubernetes keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes repository GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_repo_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Install Kubernetes control plane components
  apt:
    name:
      - "kubelet={{ k8s_package_version }}"
      - "kubeadm={{ k8s_package_version }}"
      - "kubectl={{ k8s_package_version }}"
    state: present
    update_cache: yes

- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Configure kubelet extra args via /etc/default/kubelet
  template:
    src: kubelet-extra-args.j2
    dest: /etc/default/kubelet
    mode: '0644'
  notify: Restart kubelet

- name: Remove obsolete kubelet service drop-in (config now in /etc/default/kubelet)
  file:
    path: /etc/systemd/system/kubelet.service.d/10-cgroup.conf
    state: absent
  notify: Restart kubelet

- name: Flush handlers so containerd and kubelet restart before kubeadm init
  meta: flush_handlers

- name: Ensure kubelet is enabled and started
  systemd:
    name: kubelet
    enabled: yes
    state: started
    daemon_reload: true

- name: Check if Kubernetes control plane is already initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadmin_conf

- name: Initialize Kubernetes cluster via kubeadm
  command: kubeadm init --pod-network-cidr={{ k8s_pod_network_cidr }} --apiserver-advertise-address={{ k8s_discovery_ipv4 }}
  when: not kubeadmin_conf.stat.exists
  register: kubeadm_init_output

- name: Create .kube directory for root user
  file:
    path: /root/.kube
    state: directory
    mode: '0755'
  when: not kubeadmin_conf.stat.exists

- name: Copy admin.conf to root user kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  when: not kubeadmin_conf.stat.exists

- name: Create .kube directory for admin user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0750'

- name: Copy admin.conf to admin user kubeconfig
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Generate new join token
  command: kubeadm token create --ttl 10m
  register: temp_token

- name: Get CA cert hash
  shell: openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt | openssl rsa -pubin -outform der 2>/dev/null | openssl dgst -sha256 -hex | sed 's/^.* //'
  register: ca_hash

- name: Set facts for worker nodes to read
  set_fact:
    k8s_join_token: "{{ temp_token.stdout }}"
    k8s_ca_cert_hash: "{{ ca_hash.stdout }}"

