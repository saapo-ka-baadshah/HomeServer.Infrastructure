name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  contents: read

jobs:
  destroy:
    runs-on: self-hosted
    if: inputs.confirm == 'destroy'
    env:
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure MinIO is running
        working-directory: deploy/preaction
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: docker compose up -d

      - name: Create MinIO bucket
        env:
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          mkdir -p "$HOME/bin"
          if [ ! -x "$HOME/bin/mc" ]; then
            echo "MinIO[MC]: does not exist or has wrong permission."
            echo "MinIO[MC]: installing mc binary."
            curl -sSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o "$HOME/bin/mc"
            chmod +x "$HOME/bin/mc"
          fi
          export PATH="$HOME/bin:$PATH"
          mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          mc mb --ignore-existing local/tf-state

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Start ssh-agent
        run: |
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            mkdir -p ~/.ssh
            ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ""
            echo "Generated a new SSH key. Authorize this public key for root on the Proxmox host:"
            echo "  echo \"$(cat ~/.ssh/id_ed25519.pub)\" >> /root/.ssh/authorized_keys"
          fi
          pkill -f "ssh-agent.*$SSH_AUTH_SOCK" 2>/dev/null || true
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a "$SSH_AUTH_SOCK"
          ssh-add ~/.ssh/id_ed25519

      - name: Generate terraform.tfvars
        shell: bash
        run: |
          cat > terraform.tfvars <<'EOF'
          proxmox_endpoint  = "${{ secrets.PROXMOX_ENDPOINT }}"
          proxmox_api_token = "${{ secrets.PROXMOX_TF_TOKEN }}"
          proxmox_ssh_username = "${{ secrets.PROXMOX_SSH_USER }}"
          proxmox_ssh_private_key = "${{ secrets.PROXMOX_SSH_KEY_PATH }}"
          EOF

      - name: Terraform Init
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="endpoint=http://localhost:9000" \
            -backend-config="bucket=tf-state" \
            -backend-config="key=homeserver-infra.tfstate" \
            -backend-config="access_key=${{ secrets.MINIO_ROOT_USER }}" \
            -backend-config="secret_key=${{ secrets.MINIO_ROOT_PASSWORD }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="force_path_style=true"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan (Destroy)
        run: terraform plan -input=false -destroy -out=tfdestroy

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve tfdestroy
